ARMWD_secret_network_desc:0 "We will esthablish the Armenian International Liberation Network to prepare for the eventual revolt againts the Ottoman opressors"
ARMWD_international_army_desc:0 "We will rally the armenian diaspora to create an army to liberate Armenia"
ARMWD_contact_nzhdeh_desc:0 "We will make contact with Garegin Nzhdeh. The greatest Armenian freedom fighter"
ARMWD_destroy_stability_desc:0 "We will destroy the stability of the Ottoman Administration"
ARMWD_destroy_turkish_elite_desc:0 "We will undermine the turkish elites and make them pay for what they did to us"
ARMWD_ARF_support_desc:0 "We must secure the support of the Armenian revolutionary federation"
ARMWD_contacts_in_persia_desc:0 "We will use our contacts in the persian government to procure guns for the fight againts the ottomans"
ARMWD_secret_rearming_desc:0 "We will begin the process of rearmament of the armenian army to fight the turks"
ARMWD_help_from_egypt_desc:0 "We will ask the egyptians for arms to fight the turks"
ARMWD_revolt_ready_desc:0 "We will spread anti ottoman anti turkish propaganda to rouse our people to war againts them"

KXWD_ARM.1:0 "A New Russia"
