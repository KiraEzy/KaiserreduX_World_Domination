ARMWD_secret_network_desc:0 "We will esthablish the Armenian International Liberation Network to prepare for the eventual revolt againts the Ottoman opressors"
ARMWD_international_army_desc:0 "We will rally the armenian diaspora to create an army to liberate Armenia"
ARMWD_contact_nzhdeh_desc:0 "We will make contact with Garegin Nzhdeh. The greatest Armenian freedom fighter"
ARMWD_destroy_stability_desc:0 "We will destroy the stability of the Ottoman Administration"
ARMWD_destroy_turkish_elite_desc:0 "We will undermine the turkish elites and make them pay for what they did to us"
ARMWD_ARF_support_desc:0 "We must secure the support of the Armenian revolutionary federation"
ARMWD_contacts_in_persia_desc:0 "We will use our contacts in the persian government to procure guns for the fight againts the ottomans"
ARMWD_secret_rearming_desc:0 "We will begin the process of rearmament of the armenian army to fight the turks"
ARMWD_help_from_egypt_desc:0 "We will ask the egyptians for arms to fight the turks"
ARMWD_revolt_ready_desc:0 "We will spread anti ottoman anti turkish propaganda to rouse our people to war againts them"
ARMWD_new_age_desc:0 "A new age for Armenia has come. An age of prosperity and greatness"
ARMWD_nzhdehs_ambition_desc:0 "After people rejected nzhdehs idea of ultranationalism has gotten even more ambitious and with the fall of russia to communism he might be able to convince the populace too"
ARMWD_armenian_napoleon_desc:0 "General Garegin Nzhdeh our saviour and leader also known as the Armenian Napoleon is the graetest Armenian leader and an ambitous man. His latest ambition, reclaiming Russia for the whites"
ARMWD_invite_russian_generals_desc:0 "With Nzhdehs popularity high he was able to invite the white exiles of Russia into Armenia with the goal of reclaiming russia and creating a great bulwark againts the huns and the turks and socialism"
ARMWD_meritocracy_desc:0 "A state build around merit is a state that will last for a long time. We should too implement meritocracy"
ARMWD_guided_reforms_desc:0 "We have been petitioned to begin some social reforms. But we will have to guide them for them to be trully effective"
ARMWD_patriotic_economy_desc:0 "Nzhdehs latest decree has begun to create a very patriotic economy"
ARMWD_united_in_orthodoxy_desc:0 "We shall be united in orthodoxy. We are the first christian state and we must remember that"
ARMWD_merge_russian_and_armenian_churches_desc:0 "We will begin the process of merging the Russian and Armenian Orthodox churches into one equal church of God"
ARMWD_russo_armenian_union_desc:0 "We will create the Russo-Armenian social union to equalize our two people"
ARMWD_white_exiles_arrive_desc:0 "The representatives of the exiled white movement have arived today in our capital city of Yerevan"
ARMWD_revive_army_desc:0 "We must Restore the russian white army if we want to retake Russia"
ARMWD_revive_airforce_desc:0 "creating a Russo-Armenian airforce will help us take Russia"
ARMWD_revive_navy_desc:0 "Even though the Russian navy never really was strong we still must rearm it so that we may contest the black sea"
ARMWD_for_motherland_desc:0 "To war. For the Motherland"
ARMWD_restoration_of_russia_desc:0 "With the Russian lands retaken we must decide on the how to rule them"
ARMWD_new_dynasty_desc:0 "We have decided to enthrone a new dynasty onto the throne of russia"
ARMWD_russo_armenian_empire_desc:0 "With Garegin Nzhdeh sitting on the throne of russia we will be able to create a Russo-Armenian Empire"
ARMWD_no_more_monarchs_desc:0 "No more monarchs. That is the statement echoing in the white council. As such we shall declare the Russian State"
ARMWD_russian_state_desc:0 "The Russo-Armenian Military council agreed to create the Russian State but we must still decide who will lead it"
ARMWD_hold_zemsky_sobor_desc:0 "We shall hold the zemsky sobor to decide who shall be the next monarch of the Russian Empire"
ARMWD_russian_empire_desc:0 "With the power conceded and monarch selected and crowned we have finally restored the russian empire"

KXWD_ARM.1:0 "A New Russia"
KXWD_ARM.1.t:0 "A New Russia"
KXWD_ARM.1.d:0 "Now that we have reconquered russian it is time to decide on the question of the new government"
KXWD_ARM.1.a:0 "We Will Declare the Russo-Armenian Empire"
KXWD_ARM.1.b:0 "We Will Declare the Russian Empire"
KXWD_ARM.1.c:0 "We Will Declare the Russian State"

KXWD_ARM_allied_monarchist:0 "Allied the Monarchist Officers"
KXWD_ARM_allied_republican:0 "Allied the Republican Officers"
KXWD_ARM_russo_armenian_empire_flag:0 "We have Decided on the Russo-Armenian Empire"
KXWD_ARM_russian_empire_flag:0 "We have Decided on the Russian Empire"
KXWD_ARM_russian_state_flag:0 "We have Decided on the Russian State"
KXWD_ARM.2:0 "A Russo-Armenian Empire"
KXWD_ARM.2.t:0 "A Russo-Armenian Empire"
KXWD_ARM.2.d:0 "With support from the monarchist officers Garegin Nzhdeh has been declared Nzhdeh I of the Russo-Armenian Empire"
KXWD_ARM.2.a:0 "Nzhdeh I continues his previous policies"
KXWD_ARM.2.b:0 "Nzhdeh I vows to revolutionize the empire"
KXWD_ARM.3:0 "Russian State Esthablished"
KXWD_ARM.3.t:0 "Russian State Esthablished"
KXWD_ARM.3.d:0 "With the support from the apolitical and republican officers we have esthablished the Russian state. But there is still a question of the leadership of the state"
KXWD_ARM.3.a:0 "Nzhdeh Remains in Power"
KXWD_ARM.3.b:0 "Denikin Takes Over"
KXWD_ARM.4:0 "Zemsky Sobor"
KXWD_ARM.4.t:0 "Zemsky Sobor"
KXWD_ARM.4.d:0 "With the support of the monarchist russian officers Garegin Nzhdeh has chosen to call a zemsky sobor to elect a new emperor"
KXWD_ARM.4.a:0 "Vladimir Romanov is Chosen"
KXWD_ARM.4.b:0 "Vsevolod Romanov is Chosen"
KXWD_ARM.4.c:0 "Roman Romanov is Chosen"

