KXWD_ARM.2.d:0 "With support from the monarchist officers Garegin Nzhdeh has been declared Nzhdeh I of the Russo-Armenian Empire"
KXWD_ARM.2.a:0 "Nzhdeh I continues his previous policies"
KXWD_ARM.2.b:0 "Nzhdeh I vows to revolutionize the empire"
KXWD_ARM.3:0 "Russian State Esthablished"
