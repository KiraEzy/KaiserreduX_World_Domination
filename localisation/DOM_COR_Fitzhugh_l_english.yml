l_english:

 COR_fitzhugh_protectorates:0 "A World Well Governed"
 COR_fitzhugh_protectorates_desc:0 "Fitzhugh taught that government rests on force and not on consent, that the mass of mankind is born needing masters, and that domestic slavery is the 'very best form of socialism' because a man who is owned is a man somebody has an interest in feeding. Three-fourths of free society are slaves already by his reckoning, and worse used than ours: slaves without masters, whom capital works and then discards.\n\nThe conquered world is parcelled into household states under patriarchs, monarchs, landlords and industrial superintendents, each holding the people on his land as he holds the land. Almost all of the subject races require masters outright, while among the whites it is the weak, the poor and the ignorant who are sorted to the same condition, and a board sits to say which. What a master owes his dependants is set by his own interest in them and by the Confederacy standing over him, and no court exists in which a dependant may sue.\n\nEach estate keeps its own customs and its own courts and sends its produce to Richmond, for the world is too little governed, and the bonds that bind man to man want screwing up rather than relaxing."

