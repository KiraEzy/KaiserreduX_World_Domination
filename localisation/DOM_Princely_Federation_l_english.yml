### Events ###
KXWD_PRF.1:0 "Plot Againts the Liberals"
KXWD_PRF.1.t:0 "Plot Againts the Liberals"
KXWD_PRF.1.d:0 "A number of leaders and generals have been unsatisfied with the liberalization of the government and are begining to plot againts the liberals"
KXWD_PRF.1.a:0 "We Shall Support Them"
KXWD_PRF.1.b:0 "Who Cares"
KXWD_PRF.2:0 "Pondicherry Uprising"
KXWD_PRF.2.t:0 "Pondicherry Uprising"
KXWD_PRF.2.d:0 "With our support the plotters have been able to take over madras and make Pondicherry their base of operations"
KXWD_PRF.2.a:0 "For the King"
KXWD_PRF.3:0 "The Coup"
KXWD_PRF.3.t:0 "The Coup"
KXWD_PRF.3.d:0 "Today our forces were able to seize hyderabad government and destroy the liberal government in a bloodless coup"
KXWD_PRF.3.a:0 "The Coup is Succesful"
KXWD_PRF.4:0 "To Prevent an Open Rebelion"
KXWD_PRF.4.t:0 "To Prevent an Open Rebelion"
KXWD_PRF.4.d:0 "We must strike fast to take over mysore and travancore to stop an open rebelion againts us"
KXWD_PRF.4.a:0 "Send Backup to Mysore"
KXWD_PRF.5:0 "Open Rebelion"
KXWD_PRF.5.t:0 "Open Rebelion"
KXWD_PRF.5.d:0 "When we sent troops to mysore we didnt expect such resistance. But with the right support our troops may still win"
KXWD_PRF.5.a:0 "The Rebels Win the Battle"
KXWD_PRF.5.b:0 "We Won the Battle"
KXWD_PRF.6:0 "Regency Councils Choice"
KXWD_PRF.6.t:0 "Regency Councils Choice"
KXWD_PRF.6.d:0 "The regency council only really has one choice which is our leader Salvador III de Boubon-Bhopal. And so ha shall be crowned king"
KXWD_PRF.6.a:0 "All Hail the King of India"

