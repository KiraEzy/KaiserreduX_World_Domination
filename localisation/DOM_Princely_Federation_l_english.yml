PRFWD_anti_liberal_support_desc:0 "We must gather anti liberal support for a counterrevolution"
PRFWD_sway_princes_desc:0 "We must sway any and all princes to our side"
PRFWD_contact_pondicherry_desc:0 "We must contact French monarchists in Pondicherry"
PRFWD_launch_coup_desc:0 "We are ready to launch a coup"
PRFWD_successful_coup_desc:0 "We were able to quickly seize the government buildings around the nation and arrest the liberal traitors"
PRFWD_prevent_rebelion_desc:0 "We must prevent a rebelion of liberals and unsatisfied princes who wish for more power"
PRFWD_french_support_focus_desc:0 "We must gain support from the french monarchists in Pondicherry"
PRFWD_satisfy_princes_desc:0 "With the open rebelion prevented we can satisfy the princes who wanted to rebel and reassure them that they will gain more power with our rule"
PRFWD_undo_democracy_desc:0 "We must undo democratisation and destroy socialism in our country"
PRFWD_princely_regency_council_desc:0 "We will esthablish a regency council comprised of various princes from around the country"
PRFWD_regency_choice_desc:0 "There is really only one choice for the king of india and that is the counterrevolutions leader Salvador III de Bourbon-Bhopal"
PRFWD_declare_kingdom_desc:0 "At last the kingdom is declared"
PRFWD_solidify_princes_desc:0 "We will solidify the local rule of the princes in their realms"
PRFWD_codify_classical_laws_desc:0 "We will codify classicism into our law to better govern India"
PRFWD_create_royal_guard_desc:0 "We will create a royal guard as an elite military force"
PRFWD_integralist_inspiration_focus_desc:0 "We must take inspiration from fellow integralist and maurrassist nations"
PRFWD_create_franco_indian_tradition_desc:0 "We must create united Franco-Indian traditions if we ever want to take france for the house of Bourbon-Bhopal"
PRFWD_embrace_localism_desc:0 "We must embrace localism"
PRFWD_create_royal_knights_desc:0 "We will upgrade the royal guard into an army of royal knights who serve the king of India"
PRFWD_indian_corporates_desc:0 "We must cooperate with indian corporates and companies"
PRFWD_corporate_monarchism_desc:0 "We will esthablish corporate monarchism to trully strenghten india"
PRFWD_enshrine_religious_tolerance_desc:0 "We will enshrine religious tolerance in all of our land to unite all comunities and slowly and peacefully convert them"
PRFWD_death_to_romanticism_desc:0 "We will make sure to kill romanticism to stop the spread of vile syndicalism and destructive liberalism"
PRFWD_invite_papal_mission_desc:0 "We will invite a mission from the papal states to start converting our nation to the true faith"
PRFWD_retake_france_desc:0 "We will retake france for the house of Bourbon-Bhopal"

